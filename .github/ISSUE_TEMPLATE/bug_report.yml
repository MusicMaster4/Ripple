name: Bug report
description: Something in Ripple is not working as expected.
title: "[Bug] "
body:
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Describe the actual behavior and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the game…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome on Windows, Safari on iPhone…"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Additional details
      description: Add a screenshot or relevant audio settings. Remove account emails, tokens, and private data.
