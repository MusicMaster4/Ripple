name: Small improvement
description: Suggest a focused improvement that fits Ripple's quiet character.
title: "[Idea] "
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this improve?
      description: Explain the player need or problem.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested change
      description: Keep the idea focused. Sketches and examples are welcome.
    validations:
      required: true
